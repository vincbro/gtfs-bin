[package]
name = "gtfs-bin"
version = "0.1.3"
edition = "2024"
description = "Pre compute GTFS transit networks into memory mapped binary files. Features zero copy deserialization, RAPTOR ready structures, and instant server startup."
authors = ["Vincent Brodin <vincent.brodin21@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/vincbro/gtfs-bin"
keywords = ["gtfs", "transit", "mmap", "zero-copy", "raptor"]
categories = ["data-structures", "parsing", "caching"]

[dependencies]
bitvec = "1.0.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.5.60", features = ["derive"] }
gtfs-structures = { version = "0.47.0", default-features = false, optional = true}
memmap2 = {version = "0.9.10", optional =  true}
nix = "0.31.2"
rayon = "1.11.0"
thiserror = "2.0.18"

gtfs-rt = { version = "0.5.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
prost = { version = "0.14", optional = true }
prost-derive = { version = "0.14", optional = true }
chrono = "0.4.44"

[dev-dependencies]
tempfile = "3.26.0"

[build-dependencies]
prost-build = { version = "0.14", optional = true }

[features]
default = ["consumer","compiler","rt"]

compiler = [
    "dep:gtfs-structures"
]

consumer = [
    "dep:memmap2"
]

rt = [
    "dep:gtfs-rt",
    "dep:serde",
    "dep:prost",
    "dep:prost-derive",
    "dep:prost-build"
]

[profile.release]
lto = true          
codegen-units = 1  
strip = true
