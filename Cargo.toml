[package]
name = "gtfs-bin"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Pre compute GTFS transit networks into memory mapped binary files. Features zero copy deserialization, RAPTOR ready structures, and instant server startup."
authors = ["Vincent Brodin <vincent.brodin21@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/vincbro/gtfs-bin"
keywords = ["gtfs", "transit", "mmap", "zero-copy", "raptor"]
categories = ["data-structures", "parsing", "caching"]
# Development tooling, the shared code standards and the agent notes stay out of the package.
exclude = [
  ".claude",
  ".githooks",
  ".github",
  ".gitmodules",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "STANDARDS.local.md",
  "TODO.md",
  "clippy.toml",
  "code-standards",
  "deny.toml",
  "justfile",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "taplo.toml",
]

[[bin]]
name = "gtfs-bin"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["consumer", "compiler", "rt", "cli"]

compiler = ["dep:csv", "dep:zip"]

consumer = ["dep:memmap2"]

cli = ["compiler", "dep:anyhow", "dep:clap", "dep:spinners"]

rt = ["consumer", "dep:gtfs-rt", "dep:jiff", "dep:prost"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
bitvec = "1.0.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.5.60", features = ["derive"], optional = true }
csv = { version = "1.4", optional = true }

gtfs-rt = { version = "0.5.0", optional = true }
jiff = { version = "0.2", optional = true }
memmap2 = { version = "0.9.10", optional = true }
# The version gtfs-rt is built with, so its messages decode with the same trait.
prost = { version = "0.11", optional = true }
rayon = "1.11.0"
spinners = { version = "4.2.0", optional = true }
thiserror = "2.0.18"
zip = { version = "9.7", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
tempfile = "3.26.0"


[[example]]
name = "inspect"
required-features = ["consumer", "cli"]

[[example]]
name = "apply_feed"
required-features = ["consumer", "rt", "cli"]

[[bench]]
name = "network"
harness = false
required-features = ["consumer", "compiler", "rt"]

# What we ship: `cargo build --profile dist`. Kept out of `release` so contributors' --release
# builds stay quick.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
strip = true

# Lint policy: CONTRIBUTING.md#lints, and code-standards/rust/STYLE.md for the rules each lint
# enforces (S-* ids below). A new lint from a toolchain bump is fixed, or allowed here with a
# comment, in the same change.
[lints.rust]
# Off-by-default rustc lints we want on.
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
future_incompatible = "warn"
impl_trait_redundant_captures = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"                            # S-VISIBILITY
unreachable_pub = "warn"                             # S-VISIBILITY
# S-UNSAFE: each site opts in with #[allow(unsafe_code, reason = "...")].
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rustdoc]
all = { level = "warn", priority = -1 }

# all, pedantic and cargo are on. restriction is opted into lint by lint instead of as a group: the
# group holds lints that contradict each other and grows with every toolchain.
[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed from the groups above.
missing_errors_doc = "allow"      # errors are typed enums (S-ERRORS), their variants say how a call fails
multiple_crate_versions = "allow" # we don't control our dependencies' trees
# Opted in from restriction.
# Leftovers that shouldn't ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
# S-PANICS: a panic is a bug. expect() with the invariant is allowed; unwrap() and panic!() are
# fine in tests (clippy.toml).
get_unwrap = "warn"
panic = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
# S-UNSAFE: unsafe stays rare and explained.
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# S-FLAT: nothing nests deeper than the threshold in clippy.toml.
excessive_nesting = "warn"
# S-QUALIFIED-FNS: `mem::swap`, not `std::mem::swap` (clippy.toml).
absolute_paths = "warn"
# S-NAMES-ABBREVIATIONS: single letters outside the allowed set (clippy.toml).
min_ident_chars = "warn"
# S-BOOLS: at most one bool parameter (clippy.toml).
fn_params_excessive_bools = "warn"
# S-FIELDS: a struct's fields are all pub or all private.
partial_pub_fields = "warn"
# S-DOCS: doc comments are sentences.
doc_paragraphs_missing_punctuation = "warn"
# S-INLINE: no #[inline(always)].
inline_always = "warn"
# S-TESTS: unit tests are named for the behavior. Integration tests in tests/ aren't in a
# `mod tests`, so tests_outside_test_module stays off (STANDARDS.local.md).
redundant_test_prefix = "warn"
# Clarity.
clone_on_ref_ptr = "warn"
lossy_float_literal = "warn"
mod_module_files = "warn"                # foo.rs + foo/, never foo/mod.rs
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
# Opted in from nursery, one by one like restriction.
use_self = "warn" # `Self { .. }`, not the type's name, inside its impl
