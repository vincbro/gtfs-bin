[package]
name = "gtfs-bin-core"
description = "The fixed-size types of the gtfs-bin file, and the consumer and GTFS-realtime reader that map it without copying."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gtfs", "transit", "mmap", "zero-copy", "raptor"]
categories = ["data-structures", "parsing", "caching"]

[lib]
# Skip libtest's bench harness, the benches use criterion.
bench = false

[features]
default = ["consumer", "rt"]

consumer = ["dep:memmap2"]

rt = ["consumer", "dep:gtfs-rt", "dep:jiff", "dep:prost"]

[dependencies]
bytemuck.workspace = true
gtfs-rt = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
csv.workspace = true
# Compiles the feeds the tests and benches read. A path-only dev-dependency is left out of the
# published package, so it doesn't make a cycle on crates.io.
gtfs-bin-compiler = { path = "../gtfs-bin-compiler" }
proptest.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true

# How fast a feed compiles, a file opens and queries answer, over networks of growing size:
# `just bench`.
[[bench]]
name = "transit"
harness = false
required-features = ["consumer", "rt"]
